services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-api-app
    expose:
      - "3000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: backend-api-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  postgres:
    image: postgres:16
    ports:
      - "5433:5432"
    container_name: backend-api-postgres
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

  postgres_test:
    image: postgres:16
    ports:
      - "1111:5432"
    container_name: backend-api-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: backend_api_platform_test
    volumes:
      - postgres_data:/var/lib/postgresql/test_data

volumes:
  postgres_data:
