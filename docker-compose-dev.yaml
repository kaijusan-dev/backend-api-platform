services:
  redis:
    image: redis:alpine
    container_name: backend-api-redis
    restart: unless-stopped
    ports:
      - "6379:6379" 

  postgres:
    image: postgres:16
    ports:
      - "5433:5432"
    container_name: backend-api-postgres
    env_file:
      - .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

  postgres_test:
    image: postgres:16
    ports:
      - "1111:5432"
    container_name: backend-api-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: backend_api_platform_test
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      
volumes:
  postgres_data:
  postgres_test_data: 