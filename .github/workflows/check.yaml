name: Check
on: push
jobs:
  check:
    name: Lint & Test & Build
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      VITEST: 'true'
      DATABASE_URL: postgresql://postgres:123456@localhost:5432/backend_api_platform_test
      DATABASE_URL_TEST: postgresql://postgres:123456@localhost:5432/backend_api_platform_test
      JWT_SECRET: 'test'
      REDIS_URL: redis://localhost:6379 
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: '123456'
          POSTGRES_DB: backend_api_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d backend_api_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Prepare test database
        run: npx prisma db push --skip-generate

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm run test:run

      - name: Build project
        run: npm run build
