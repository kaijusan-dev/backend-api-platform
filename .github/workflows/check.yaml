name: Check
on: push
jobs:
  check:
    name: Lint & Test & Build
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      VITEST: 'true'
      DATABASE_URL: postgresql://postgres:1234@localhost:5432/backend_api_platform_test
      DATABASE_URL_TEST: postgresql://postgres:1234@localhost:5432/backend_api_platform_test
      JWT_SECRET: 'test'
      REDIS_URL: 'test'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: '1234'
          POSTGRES_DB: backend_api_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d backend_api_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Prepare test database
        run: npm run prisma:push:test

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm run test:run

      - name: Build project
        run: npm run build
