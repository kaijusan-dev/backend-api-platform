services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-api-app
    expose:
      - "3000"
    env_file:
      - .env.prod
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: backend-api-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  redis:
    image: redis:alpine
    container_name: backend-api-redis
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: backend-api-postgres
    env_file:
      - .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5
      
volumes:
  postgres_data: