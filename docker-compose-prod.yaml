services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: backend-api-app
    expose:
      - "3000"
    env_file:
      - .env.prod
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: backend-api-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - app

  certbot:
    image: certbot/certbot
    container_name: backend-api-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: certbot
    command: ["renew", "--webroot", "-w", "/var/www/certbot"]
    restart: "no"

  redis:
    image: redis:alpine
    container_name: backend-api-redis
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: backend-api-postgres
    env_file:
      - .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5
      
volumes:
  postgres_data: